name: CI

on:
  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch:

  workflow_call:
    inputs:
      build_container_images:
        description: Build DEV container images
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Validate application foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      NODE_ENV: test
      API_PORT: 3000
      SWAGGER_ENABLED: "false"

      JWT_ACCESS_SECRET: ci-test-jwt-secret-minimum-32-characters
      JWT_ACCESS_TTL_SECONDS: "900"

      REFRESH_TOKEN_PEPPER: ci-test-refresh-pepper-minimum-32-characters
      REFRESH_TOKEN_TTL_SECONDS: "604800"

      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: lax
      AUTH_REGISTER_RATE_LIMIT: "3"
      AUTH_REGISTER_RATE_TTL_SECONDS: "3600"
      AUTH_LOGIN_RATE_LIMIT: "5"
      AUTH_LOGIN_RATE_TTL_SECONDS: "60"
      AUTH_REFRESH_RATE_LIMIT: "20"
      AUTH_REFRESH_RATE_TTL_SECONDS: "60"

      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_HOST_PORT: 5432
      POSTGRES_DB: project_management
      POSTGRES_USER: project_management
      POSTGRES_PASSWORD: ci-test-password

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: project_management
          POSTGRES_USER: project_management
          POSTGRES_PASSWORD: ci-test-password

        ports:
          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U project_management -d project_management"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.3.4
          runtime: node@24.21.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Verify tool versions
        run: |
          node --version
          pnpm --version
          docker compose version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run API E2E tests
        run: pnpm test:e2e

      - name: Build applications
        run: pnpm build

      - name: Validate local PostgreSQL Compose contract
        run: bash infra/docker/compose.local.test.sh

      - name: Validate DEV Compose contract
        run: bash infra/docker/compose.dev.test.sh

      - name: Build DEV container images
        if: ${{ github.event_name != 'workflow_call' || inputs.build_container_images }}
        run: >-
          docker compose
          --env-file .env.example
          -f infra/docker/compose.dev.yml
          build

      - name: Verify API runtime migration
        if: ${{ github.event_name != 'workflow_call' || inputs.build_container_images }}
        run: bash infra/docker/api-runtime.test.sh --skip-build
