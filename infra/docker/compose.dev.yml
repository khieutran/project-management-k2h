name: project-management-k2h-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    image: "${API_IMAGE:-project-management-k2h-api}:${IMAGE_TAG:-dev}"
    restart: unless-stopped
    init: true

    build:
      context: ../..
      dockerfile: apps/api/Dockerfile

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3000
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}

      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS}

      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      AUTH_REGISTER_RATE_LIMIT: ${AUTH_REGISTER_RATE_LIMIT:-3}
      AUTH_REGISTER_RATE_TTL_SECONDS: ${AUTH_REGISTER_RATE_TTL_SECONDS:-3600}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-5}
      AUTH_LOGIN_RATE_TTL_SECONDS: ${AUTH_LOGIN_RATE_TTL_SECONDS:-60}
      AUTH_REFRESH_RATE_LIMIT: ${AUTH_REFRESH_RATE_LIMIT:-20}
      AUTH_REFRESH_RATE_TTL_SECONDS: ${AUTH_REFRESH_RATE_TTL_SECONDS:-60}
      DEMO_SESSION_TTL_SECONDS: ${DEMO_SESSION_TTL_SECONDS:-86400}
      DEMO_RATE_LIMIT: ${DEMO_RATE_LIMIT:-3}
      DEMO_RATE_TTL_SECONDS: ${DEMO_RATE_TTL_SECONDS:-3600}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: "${WEB_IMAGE:-project-management-k2h-web}:${IMAGE_TAG:-dev}"
    restart: unless-stopped

    build:
      context: ../..
      dockerfile: apps/web/Dockerfile

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_dev_data:
