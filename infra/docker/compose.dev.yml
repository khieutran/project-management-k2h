name: project-management-k2h-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    image: "${API_IMAGE:-project-management-k2h-api}:${IMAGE_TAG:-dev}"
    restart: unless-stopped
    init: true

    build:
      context: ../..
      dockerfile: apps/api/Dockerfile

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3000
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}

      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS}

      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      AUTH_REGISTER_RATE_LIMIT: ${AUTH_REGISTER_RATE_LIMIT:-3}
      AUTH_REGISTER_RATE_TTL_SECONDS: ${AUTH_REGISTER_RATE_TTL_SECONDS:-3600}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-5}
      AUTH_LOGIN_RATE_TTL_SECONDS: ${AUTH_LOGIN_RATE_TTL_SECONDS:-60}
      AUTH_REFRESH_RATE_LIMIT: ${AUTH_REFRESH_RATE_LIMIT:-20}
      AUTH_REFRESH_RATE_TTL_SECONDS: ${AUTH_REFRESH_RATE_TTL_SECONDS:-60}
      DEMO_SESSION_TTL_SECONDS: ${DEMO_SESSION_TTL_SECONDS:-86400}
      DEMO_RATE_LIMIT: ${DEMO_RATE_LIMIT:-3}
      DEMO_RATE_TTL_SECONDS: ${DEMO_RATE_TTL_SECONDS:-3600}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: "${WEB_IMAGE:-project-management-k2h-web}:${IMAGE_TAG:-dev}"
    restart: unless-stopped

    build:
      context: ../..
      dockerfile: apps/web/Dockerfile

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Daily database dump into the postgres_dev_backups volume, newest 7 kept. Turns
  # "unhealthy" in `docker compose ps` when the newest dump is missing or older than 26 hours.
  # Copy one out: docker compose cp backup:/backups/<file>.dump .
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP: 7
      BACKUP_EVERY_HOURS: 24
    volumes:
      - postgres_dev_backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          newest=$$(ls -1t /backups/*.dump 2>/dev/null | head -n 1)
          if [ -z "$$newest" ] || [ $$(( $$(date +%s) - $$(stat -c %Y "$$newest") )) -ge $$((BACKUP_EVERY_HOURS * 3600)) ]; then
            file=/backups/$$PGDATABASE-$$(date -u +%Y%m%d-%H%M%S).dump
            # Written under a temporary name and checked, so a failed dump never looks like a backup.
            if pg_dump -Fc --no-owner -f "$$file.partial" && pg_restore --list "$$file.partial" >/dev/null; then
              mv "$$file.partial" "$$file" && echo "backup: $$file"
              ls -1t /backups/*.dump | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
            else
              rm -f "$$file.partial"
              echo "backup: FAILED" >&2
            fi
          fi
          sleep 3600
        done
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'f=$$(ls -1t /backups/*.dump 2>/dev/null | head -n 1); [ -n "$$f" ] && [ $$(( $$(date +%s) - $$(stat -c %Y "$$f") )) -lt $$(( (BACKUP_EVERY_HOURS + 2) * 3600 )) ]',
        ]
      interval: 5m
      timeout: 10s
      start_period: 2m

volumes:
  postgres_dev_data:
  postgres_dev_backups:
